name: uptime-watch

"on":
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: uptime-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run uptime checks
        run: bash ops/uptime-check.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
